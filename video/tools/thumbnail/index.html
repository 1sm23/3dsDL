<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>3dsDL thumbnails</title>
    <!-- The YouTube thumbnail, 1280 x 720. make.sh snapshots it and writes
         the JPG. The console is a still of the film's white console
         (tools/console-blender/still.py, cropped to the console). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 800; src: url("assets/m-plus-rounded-1c-800-latin.woff2") format("woff2"); }
      @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 700; src: url("assets/m-plus-rounded-1c-700-latin.woff2") format("woff2"); }
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f2e9a3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .v { position: absolute; inset: 0; overflow: hidden; font-family: "M PLUS Rounded 1c", sans-serif;
        background: radial-gradient(ellipse 70% 80% at 72% 55%, #d7f0f2 0%, rgba(215, 240, 242, 0) 60%),
                    linear-gradient(180deg, #f8f2cc 0%, #f2e9a3 100%); }
      .dots { position: absolute; inset: 0; background-image: radial-gradient(#b0a66e 1.4px, transparent 1.6px); background-size: 22px 22px; opacity: 0.18; }
      .console { position: absolute; width: 720px; height: 543px; filter: drop-shadow(0 26px 30px rgba(60, 50, 20, 0.28)); }
      .headline { position: absolute; left: 56px; font-weight: 800; color: #2a2722; line-height: 0.92; letter-spacing: -0.01em;
        text-shadow: 0 4px 0 rgba(255, 253, 240, 0.9), 0 10px 24px rgba(70, 60, 20, 0.25); white-space: nowrap; }
      .blue { color: #1179a6; }
      .icon { position: absolute; width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 6px 14px rgba(70, 60, 20, 0.2); }
      .ring { position: absolute; box-sizing: border-box; border: 7px solid #3cdc78; border-radius: 38px; box-shadow: 0 0 18px rgba(160, 250, 160, 0.9); }
      .pill { position: absolute; left: 60px; padding: 10px 26px; border-radius: 999px; background: #17799f; color: #fff;
        font-weight: 800; font-size: 34px; box-shadow: 0 8px 18px rgba(23, 121, 159, 0.35); white-space: nowrap; }
      .qr { position: absolute; width: 190px; height: 190px; border-radius: 22px; background: #fff; display: flex; align-items: center;
        justify-content: center; box-shadow: 0 16px 30px rgba(70, 60, 20, 0.28); transform: rotate(-8deg); }
      .qr img { width: 160px; height: 160px; }
      .arrow { position: absolute; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="thumbs" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <div id="vc" class="v clip" data-start="0" data-duration="1" data-track-index="0">
        <div class="dots"></div>
        <img class="console" src="assets/console-white-crop.png" style="left:560px;top:105px;width:720px;height:530px" alt="" />
        <div class="ring" style="left:54px;top:98px;width:152px;height:152px"></div>
        <img class="icon" src="assets/icon.png" style="left:70px;top:114px" alt="" />
        <div class="headline" style="top:285px;font-size:150px">3ds<span class="blue">DL</span></div>
        <div class="pill" style="top:480px">The homebrew downloader</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["thumbs"] = tl;
    </script>
  </body>
</html>
