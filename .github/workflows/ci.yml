name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev zlib1g-dev

      - name: Unit and integration tests (ASan + UBSan)
        run: make -C tests check

  build:
    name: 3DSX and CIA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with the pinned toolchain
        run: ./scripts/build.sh
        env:
          THREEDSDL_BUILD_JOBS: 4

      - uses: actions/upload-artifact@v4
        with:
          name: 3dsDL-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 3dsDL-${{ github.sha }}
          path: dist

      - name: Check that the tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})." >&2
            exit 1
          fi

      - name: Verify checksums
        run: cd dist && sha256sum -c 3dsDL.sha256

      # Created as a draft so a maintainer can review it before publishing.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/3dsDL.3dsx dist/3dsDL.cia dist/3dsDL.smdh dist/3dsDL.sha256 \
            --title "3dsDL ${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft
