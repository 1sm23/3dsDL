name: Prepare localization catalog

on:
  push:
    branches: [fix/complete-i18n]
    paths: ['.github/workflows/prepare-i18n.yml', 'scripts/prepare-i18n.py', 'romfs/i18n.json']

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare missing translations
        run: python3 scripts/prepare-i18n.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-draft
          path: romfs/i18n.json
