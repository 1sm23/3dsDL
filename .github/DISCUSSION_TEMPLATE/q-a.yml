body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using 3dsDL. The [guide](https://github.com/ankushKun/3dsDL/blob/main/docs/USAGE.md) covers each screen, the controls and the settings, so it may already have the answer. If something is broken, a [bug report](https://github.com/ankushKun/3dsDL/issues/new?template=bug.yml) gets it fixed faster.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do and where you got stuck.
    validations:
      required: true

  - type: input
    id: details
    attributes:
      label: 3dsDL version and console
      description: Shown in 3dsDL under Settings → Report Issue. It often changes the answer.
      placeholder: 3dsDL 0.7.1 (CIA) on New Nintendo 3DS XL, 11.17.0-50U
