<!doctype html>
<!-- The 3dsDL wordmark used as the banner's logo texture. Rendered by
     resources/banner/render.sh at 1024 x 512 with a transparent background,
     then scaled to 256 x 128 (the largest texture pycgfx keeps). The thick
     white outline keeps it readable on every HOME Menu theme. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Mark";
    font-weight: 800;
    src: url(../../site/fonts/m-plus-rounded-1c-800-latin.woff2) format("woff2");
  }
  html, body {
    margin: 0;
    width: 1024px;
    height: 512px;
    background: transparent;
  }
  .stage {
    position: relative;
    width: 1024px;
    height: 512px;
  }
  .word {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 18px;
    font: 800 286px/1 "Mark", sans-serif;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  /* Behind: the white sticker edge and its drop shadow. */
  .edge {
    color: #fff;
    -webkit-text-stroke: 46px #fff;
    paint-order: stroke fill;
    filter: drop-shadow(0 16px 0 rgba(12, 58, 96, 0.38));
  }
  /* In front: the letters, glossy top to bottom. */
  .face span {
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .face .t3 {
    background-image: linear-gradient(#7de9ff 0%, #2cc3ef 46%, #109fd8 54%, #0d86c4 100%);
  }
  .face .dl {
    background-image: linear-gradient(#41678c 0%, #1f3d5c 48%, #142b44 54%, #0f2236 100%);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="word edge"><span>3ds</span><span>DL</span></div>
    <div class="word face"><span class="t3">3ds</span><span class="dl">DL</span></div>
  </div>
</body>
</html>
